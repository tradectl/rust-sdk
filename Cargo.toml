[package]
name = "tradectl-sdk"
version = "0.2.7"
edition = "2021"
# File::try_lock (local-bot)
rust-version = "1.89"
description = "Crypto trading strategy SDK — types, traits, exchange abstractions"

[features]
default = []
# Channel-only now — the broadcaster needs just tokio's broadcast (sync). The
# WS serving moved to tradectl-bot-api's `/v1/stream`, so no tungstenite here.
monitor = ["tokio/sync"]
# Test knobs of the monitor broadcaster: `MonitorBroadcaster::stats` and
# `with_lane_capacities`. Tests and engine/e2e only.
testhook = ["monitor"]
runner = ["clap"]
# Local bot rules shared by the CLI, the Lab and the engine: the lock, the
# holder record, process identity, legacy detection, bot id, status.json,
# Delete. OS code, so never enabled in a strategy crate.
local-bot = ["dep:libc", "dep:windows-sys", "dep:rand"]

[dependencies]
async-trait = "0.1"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync"] }
log = "0.4"
clap = { version = "4", features = ["derive"], optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
tracing-log = "0.2"
flate2 = "1"
once_cell = "1"
dirs = "6"
rand = { version = "0.9", optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", optional = true, features = [
  "Win32_Foundation", "Win32_System_Threading", "Win32_System_SystemInformation",
  "Win32_System_Registry", "Win32_System_Console", "Win32_Storage_FileSystem",
  "Wdk_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi", "Win32_System_Shutdown", "Win32_System_LibraryLoader",
  "Win32_System_WindowsProgramming", "Win32_Security" ] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

